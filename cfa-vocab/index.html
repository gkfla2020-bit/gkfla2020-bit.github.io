    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

{% include sidebar-styles.html %}

.container{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:40px 24px 80px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,5vw,2.4rem);font-weight:300;margin-bottom:4px;color:var(--text,#1a1a1a)}
.page-subtitle{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted,#888);letter-spacing:.2em;text-transform:uppercase;margin-bottom:24px}

/* stats */
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card-bg,#fff);border:1px solid var(--border-medium,#e8e8e8);padding:10px 16px;flex:1;min-width:100px}
.stat b{display:block;font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:400;color:var(--text,#1a1a1a)}
.stat span{font-size:.68rem;color:var(--text-muted,#999);letter-spacing:.08em;text-transform:uppercase}
.stat .bar{height:4px;background:var(--border-heavy,#f0f0f0);border-radius:2px;margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:2px;transition:width .4s}

/* controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.controls select{font-family:'Inter',sans-serif;font-size:.82rem;padding:8px 10px;border:1px solid var(--border-medium,#ddd);background:var(--card-bg,#fff);color:var(--text,#1a1a1a);border-radius:0;outline:none;cursor:pointer}
.mode-toggle{display:flex;border:1px solid var(--text,#1a1a1a);margin-right:auto}
.mode-toggle button{font-family:'Space Mono',monospace;font-size:.75rem;padding:8px 16px;background:var(--card-bg,#fff);color:var(--text,#1a1a1a);border:none;cursor:pointer;letter-spacing:.05em}
.mode-toggle button.on{background:var(--text,#1a1a1a);color:var(--bg,#fff)}
.chk{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--text-secondary,#555);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent,#1a1a1a);cursor:pointer}
.reset-btn{font-size:.7rem;color:var(--text-faint,#bbb);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px}
.reset-btn:hover{color:var(--down,#c0392b)}

/* card */
.stage{min-height:340px}
.card{background:var(--card-bg,#fff);border:1px solid var(--border-medium,#e8e8e8);padding:34px 30px;cursor:pointer;min-height:300px;display:flex;flex-direction:column;justify-content:center;position:relative;transition:box-shadow .2s;user-select:none;-webkit-user-select:none}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.05)}
.card .meta{position:absolute;top:16px;left:20px;right:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--border-medium,#e0e0e0);color:var(--text-muted,#888);background:var(--bg-soft,#fafaf8)}
.badge.imp3{border-color:var(--down,#c0392b);color:var(--down,#c0392b)}
.badge.imp2{border-color:#c69026;color:#c69026}
.badge.box{margin-left:auto}
.badge.done{border-color:var(--up,#28a745);color:var(--up,#28a745)}
.card .word{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,6vw,2.7rem);font-weight:400;text-align:center;line-height:1.25;word-break:keep-all;color:var(--text,#1a1a1a)}
.card .hint{text-align:center;font-size:.72rem;color:var(--text-faintest,#c4c4c4);margin-top:18px;letter-spacing:.1em}
.card .kr{font-size:1.45rem;font-weight:600;text-align:center;margin-bottom:14px;word-break:keep-all;color:var(--text,#1a1a1a)}
.card .word-sm{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--text-muted,#999);text-align:center;font-style:italic;margin-bottom:18px}
.card .def{font-size:.92rem;color:var(--text-secondary,#444);line-height:1.75;padding:14px 16px;background:var(--bg-soft,#fafaf8);border-left:2px solid var(--text,#1a1a1a);margin-bottom:12px;word-break:keep-all}
.card .trap{font-size:.88rem;color:var(--text-secondary,#8a3324);line-height:1.7;padding:14px 16px;background:rgba(220,38,38,.06);border-left:2px solid var(--down,#c0392b);word-break:keep-all}
.card .trap b{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;display:block;margin-bottom:4px;color:var(--down,#c0392b)}

/* grade buttons */
.grade{display:flex;gap:10px;margin-top:14px}
.grade button{flex:1;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;padding:15px;border:1px solid;background:var(--card-bg,#fff);cursor:pointer;transition:all .15s}
.grade .no{border-color:var(--down,#c0392b);color:var(--down,#c0392b)}
.grade .no:hover{background:var(--down,#c0392b);color:#fff}
.grade .yes{border-color:var(--up,#28a745);color:var(--up,#28a745)}
.grade .yes:hover{background:var(--up,#28a745);color:#fff}
.grade button span{font-family:'Space Mono',monospace;font-size:.65rem;opacity:.55;margin-left:6px}

/* quiz */
.quiz-q{background:var(--card-bg,#fff);border:1px solid var(--border-medium,#e8e8e8);padding:28px 30px;margin-bottom:12px;position:relative}
.quiz-q .meta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quiz-q .prompt{font-size:.8rem;color:var(--text-muted,#888);margin-bottom:8px}
.quiz-q .prompt b{color:var(--text-secondary,#555)}
.quiz-q .word{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.25;color:var(--text,#1a1a1a)}
.quiz-score{position:absolute;top:16px;right:20px;font-family:'Space Mono',monospace;font-size:.72rem;color:var(--text-muted,#999)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:baseline;gap:12px;text-align:left;font-family:'Inter',sans-serif;font-size:.95rem;padding:15px 18px;background:var(--card-bg,#fff);border:1px solid var(--border-medium,#e0e0e0);color:var(--text,#1a1a1a);cursor:pointer;transition:all .15s;word-break:keep-all;line-height:1.5}
.choice:hover{border-color:var(--text,#1a1a1a)}
.choice .abc{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--text-muted,#999);flex-shrink:0}
.choice.correct{border-color:var(--up,#28a745);background:rgba(34,197,94,.08)}
.choice.correct .abc{color:var(--up,#28a745)}
.choice.wrong{border-color:var(--down,#c0392b);background:rgba(220,38,38,.08)}
.choice.wrong .abc{color:var(--down,#c0392b)}
.choice:disabled{cursor:default;opacity:.92}
.quiz-reveal{margin-top:12px;display:none}
.quiz-reveal.show{display:block}
.quiz-reveal .def{font-size:.9rem;color:var(--text-secondary,#444);line-height:1.7;padding:13px 16px;background:var(--bg-soft,#fafaf8);border-left:2px solid var(--text,#1a1a1a);margin-bottom:10px;word-break:keep-all}
.quiz-reveal .trap{font-size:.86rem;color:var(--text-secondary,#8a3324);line-height:1.7;padding:13px 16px;background:rgba(220,38,38,.06);border-left:2px solid var(--down,#c0392b);word-break:keep-all}
.quiz-reveal .trap b{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.1em;display:block;margin-bottom:4px;color:var(--down,#c0392b)}
.next-btn{width:100%;margin-top:12px;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;padding:15px;border:1px solid var(--text,#1a1a1a);background:var(--text,#1a1a1a);color:var(--bg,#fff);cursor:pointer}
.next-btn span{font-family:'Space Mono',monospace;font-size:.65rem;opacity:.6;margin-left:6px}

.empty-msg{text-align:center;padding:70px 20px;color:var(--text-muted,#999);font-size:.9rem}
.kbd-hint{margin-top:22px;text-align:center;font-size:.68rem;color:var(--text-faintest,#c4c4c4);letter-spacing:.05em}
.kbd-hint kbd{font-family:'Space Mono',monospace;border:1px solid var(--border-medium,#e0e0e0);padding:1px 5px;background:var(--card-bg,#fff);color:var(--text-secondary,#555);border-radius:3px}

@media(max-width:640px){
  .container{padding:28px 16px 60px}
  .card{padding:56px 20px 28px}
  .kbd-hint{display:none}
}

<body>

{% include sidebar.html %}

<div class="main-wrapper">
<div class="container">
    {% include breadcrumb.html %}
    <h1 class="page-title">CFA Vocab Trainer</h1>
    <p class="page-subtitle">1,134 Words · Retrieval Practice</p>

    <div class="stats">
        <div class="stat"><b id="st-done">–</b><span>암기 완료</span><div class="bar"><i id="st-bar" style="width:0%"></i></div></div>
        <div class="stat"><b id="st-learn">–</b><span>학습 중</span></div>
        <div class="stat"><b id="st-today">0</b><span>오늘 학습</span></div>
    </div>

    <div class="controls">
        <div class="mode-toggle">
            <button id="m-card" class="on">카드</button>
            <button id="m-quiz">퀴즈</button>
        </div>
        <select id="f-subj">
            <option value="">전체 과목</option>
        </select>
        <select id="f-imp">
            <option value="0">전체 중요도</option>
            <option value="3">★★★ 반드시 암기</option>
            <option value="2">★★ 이상</option>
        </select>
        <label class="chk"><input type="checkbox" id="f-todo">미암기만</label>
        <button class="reset-btn" id="btn-reset">기록 초기화</button>
    </div>

    <div class="stage" id="stage"></div>
    <p class="kbd-hint" id="kbd-hint"><kbd>Space</kbd> 뒤집기 · <kbd>1</kbd> 몰랐다 · <kbd>2</kbd> 알았다</p>
</div>
</div>

<script>
(function(){
'use strict';
var WORDS=[], POOL=[], cur=null, flipped=false, mode='card';
var recentQ=[]; // 최근 출제 인덱스(POOL 기준 원본 idx) — 단기 중복 방지
var quizAnswered=false, quizScore={ok:0,n:0};
var LS_PROG='cfaVocabProg', LS_TODAY='cfaVocabToday';

var prog={}; // en -> box(0~3). 없으면 미학습
try{prog=JSON.parse(localStorage.getItem(LS_PROG))||{};}catch(e){prog={};}
function saveProg(){try{localStorage.setItem(LS_PROG,JSON.stringify(prog));}catch(e){}}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var today={d:todayStr(),n:0};
try{var t=JSON.parse(localStorage.getItem(LS_TODAY));if(t&&t.d===todayStr())today=t;}catch(e){}
function bumpToday(){today.n++;try{localStorage.setItem(LS_TODAY,JSON.stringify(today));}catch(e){}}

function box(w){return prog[w.e]||0;}
function setBox(w,b){prog[w.e]=b;saveProg();}

var $=function(id){return document.getElementById(id);};
var stage=$('stage');

// ---------- pool & scheduling ----------
function rebuildPool(){
  var subj=$('f-subj').value, imp=+$('f-imp').value, todo=$('f-todo').checked;
  POOL=WORDS.filter(function(w){
    if(subj&&w.s!==subj)return false;
    if(imp&&w.i<imp)return false;
    if(todo&&box(w)>=2)return false;
    return true;
  });
  recentQ=[];
}

// 틀렸거나 새로운 단어(box 낮음)를 우선 뽑되, 최근 본 단어는 피한다
function pickNext(){
  if(!POOL.length)return null;
  var avoid={};
  recentQ.forEach(function(e){avoid[e]=1;});
  var tiers=[[],[],[],[]];
  POOL.forEach(function(w){if(!avoid[w.e])tiers[box(w)].push(w);});
  var cand=null;
  // box0 60% / box1 25% / box2 10% / box3 5% 확률로 티어 선택, 빈 티어는 낮은 쪽부터 대체
  var r=Math.random(), want=r<.6?0:r<.85?1:r<.95?2:3;
  for(var i=0;i<4;i++){var t=(want+i)%4;if(tiers[t].length){cand=tiers[t][Math.floor(Math.random()*tiers[t].length)];break;}}
  if(!cand)cand=POOL[Math.floor(Math.random()*POOL.length)]; // 전부 recent인 소형 풀
  recentQ.push(cand.e);
  if(recentQ.length>Math.min(8,Math.max(1,POOL.length-2)))recentQ.shift();
  return cand;
}

// ---------- stats ----------
function renderStats(){
  var subj=$('f-subj').value, imp=+$('f-imp').value;
  var scope=WORDS.filter(function(w){
    if(subj&&w.s!==subj)return false;
    if(imp&&w.i<imp)return false;
    return true;
  });
  var done=0,learn=0;
  scope.forEach(function(w){var b=box(w);if(b>=2)done++;else if(b===1)learn++;});
  $('st-done').textContent=done+' / '+scope.length;
  $('st-bar').style.width=(scope.length?Math.round(done/scope.length*100):0)+'%';
  $('st-learn').textContent=learn;
  $('st-today').textContent=today.n;
}

// ---------- helpers ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function badges(w){
  var h='<span class="badge">'+esc(w.s)+'</span>';
  if(w.l)h+='<span class="badge">'+esc(w.l)+'</span>';
  h+='<span class="badge imp'+w.i+'">'+(w.i===3?'★★★':w.i===2?'★★':'★')+'</span>';
  var b=box(w);
  h+='<span class="badge box'+(b>=2?' done':'')+'">'+(b>=2?'암기':b===1?'학습중':'미학습')+'</span>';
  return h;
}

// ---------- card mode ----------
function renderCard(){
  cur=pickNext();
  flipped=false;
  if(!cur){stage.innerHTML='<div class="empty-msg">조건에 맞는 단어가 없습니다. 필터를 바꿔보세요.</div>';return;}
  stage.innerHTML=
    '<div class="card" id="card">'+
      '<div class="meta">'+badges(cur)+'</div>'+
      '<div class="word">'+esc(cur.e)+'</div>'+
      '<div class="hint">탭하거나 Space로 뒤집기</div>'+
    '</div>';
  $('card').onclick=flip;
}
function flip(){
  if(!cur||flipped)return;
  flipped=true;
  var h='<div class="meta">'+badges(cur)+'</div>'+
    '<div class="word-sm">'+esc(cur.e)+'</div>'+
    '<div class="kr">'+esc(cur.k)+'</div>';
  if(cur.d)h+='<div class="def">'+esc(cur.d)+'</div>';
  if(cur.t)h+='<div class="trap"><b>출제 함정</b>'+esc(cur.t)+'</div>';
  $('card').innerHTML=h;
  $('card').onclick=null;
  $('card').style.cursor='default';
  var g=document.createElement('div');
  g.className='grade';
  g.innerHTML='<button class="no">몰랐다<span>1</span></button><button class="yes">알았다<span>2</span></button>';
  stage.appendChild(g);
  g.querySelector('.no').onclick=function(){grade(false);};
  g.querySelector('.yes').onclick=function(){grade(true);};
}
function grade(ok){
  if(!cur||!flipped)return;
  setBox(cur,ok?Math.min(3,box(cur)+1):0);
  bumpToday();renderStats();
  renderCard();
}

// ---------- quiz mode ----------
function renderQuiz(){
  cur=pickNext();
  quizAnswered=false;
  if(!cur||POOL.length<3){stage.innerHTML='<div class="empty-msg">퀴즈에는 단어가 3개 이상 필요합니다. 필터를 바꿔보세요.</div>';cur=null;return;}
  // 같은 과목에서 오답 보기 2개 (부족하면 전체에서)
  var sameSubj=POOL.filter(function(w){return w.e!==cur.e&&w.k!==cur.k&&w.s===cur.s;});
  if(sameSubj.length<2)sameSubj=WORDS.filter(function(w){return w.e!==cur.e&&w.k!==cur.k;});
  var d1=sameSubj[Math.floor(Math.random()*sameSubj.length)],d2;
  do{d2=sameSubj[Math.floor(Math.random()*sameSubj.length)];}while(d2.k===d1.k&&sameSubj.length>2);
  var opts=[cur,d1,d2].sort(function(){return Math.random()-.5;});
  var abc=['A','B','C'];
  var h='<div class="quiz-q">'+
      '<div class="quiz-score">'+quizScore.ok+' / '+quizScore.n+'</div>'+
      '<div class="meta">'+badges(cur)+'</div>'+
      '<div class="prompt">다음 단어의 뜻으로 <b>가장 적절한</b> 것은?</div>'+
      '<div class="word">'+esc(cur.e)+'</div>'+
    '</div><div class="choices">';
  opts.forEach(function(o,i){
    h+='<button class="choice" data-ok="'+(o.e===cur.e?1:0)+'"><span class="abc">'+abc[i]+'</span>'+esc(o.k)+'</button>';
  });
  h+='</div><div class="quiz-reveal" id="reveal">';
  if(cur.d)h+='<div class="def">'+esc(cur.d)+'</div>';
  if(cur.t)h+='<div class="trap"><b>출제 함정</b>'+esc(cur.t)+'</div>';
  h+='<button class="next-btn">다음 문제<span>Enter</span></button></div>';
  stage.innerHTML=h;
  var btns=stage.querySelectorAll('.choice');
  btns.forEach(function(b){b.onclick=function(){answer(b);};});
}
function answer(btn){
  if(quizAnswered||!cur)return;
  quizAnswered=true;
  var ok=btn.dataset.ok==='1';
  quizScore.n++;if(ok)quizScore.ok++;
  stage.querySelectorAll('.choice').forEach(function(b){
    b.disabled=true;
    if(b.dataset.ok==='1')b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
  });
  setBox(cur,ok?Math.min(3,box(cur)+1):0);
  bumpToday();renderStats();
  var rv=$('reveal');
  rv.classList.add('show');
  rv.querySelector('.next-btn').onclick=render;
  stage.querySelector('.quiz-score').textContent=quizScore.ok+' / '+quizScore.n;
}
function answerByIndex(i){
  var btns=stage.querySelectorAll('.choice');
  if(btns[i]&&!quizAnswered)answer(btns[i]);
}

// ---------- render / events ----------
function render(){mode==='card'?renderCard():renderQuiz();}

function setMode(m){
  mode=m;
  $('m-card').classList.toggle('on',m==='card');
  $('m-quiz').classList.toggle('on',m==='quiz');
  $('kbd-hint').innerHTML=m==='card'
    ?'<kbd>Space</kbd> 뒤집기 · <kbd>1</kbd> 몰랐다 · <kbd>2</kbd> 알았다'
    :'<kbd>1·2·3</kbd> 또는 <kbd>A·B·C</kbd> 선택 · <kbd>Enter</kbd> 다음';
  render();
}
$('m-card').onclick=function(){setMode('card');};
$('m-quiz').onclick=function(){setMode('quiz');};

['f-subj','f-imp'].forEach(function(id){$(id).onchange=function(){rebuildPool();renderStats();render();};});
$('f-todo').onchange=function(){rebuildPool();renderStats();render();};

$('btn-reset').onclick=function(){
  if(!confirm('학습 기록(암기 상태)을 모두 초기화할까요?'))return;
  prog={};saveProg();quizScore={ok:0,n:0};
  rebuildPool();renderStats();render();
};

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(mode==='card'){
    if(e.code==='Space'){e.preventDefault();flipped?null:flip();}
    else if(e.key==='1'&&flipped)grade(false);
    else if(e.key==='2'&&flipped)grade(true);
  }else{
    if(!quizAnswered){
      if(e.key==='1'||e.key==='a'||e.key==='A')answerByIndex(0);
      else if(e.key==='2'||e.key==='b'||e.key==='B')answerByIndex(1);
      else if(e.key==='3'||e.key==='c'||e.key==='C')answerByIndex(2);
    }else if(e.key==='Enter'){e.preventDefault();render();}
  }
});

// ---------- init ----------
fetch('/cfa-vocab/words.json').then(function(r){return r.json();}).then(function(data){
  WORDS=data;
  // 과목 필터 옵션 (데이터 순서 유지)
  var seen={},sel=$('f-subj');
  WORDS.forEach(function(w){
    if(seen[w.s])return;seen[w.s]=1;
    var o=document.createElement('option');o.value=w.s;o.textContent=w.s;sel.appendChild(o);
  });
  rebuildPool();renderStats();render();
}).catch(function(e){
  stage.innerHTML='<div class="empty-msg">단어 데이터를 불러오지 못했습니다.</div>';
});
})();
</script>
</body>
