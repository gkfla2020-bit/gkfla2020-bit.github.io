# Site Settings
title: Ha Rim Jung
description: Quantitative Researcher | Sogang University
url: "https://gkfla2020-bit.github.io"
baseurl: ""

# Author
author:
  name: Ha Rim Jung
  email: gkfla2020@gmail.com
  github: gkfla2020-bit

# API Keys (set via environment variable FINNHUB_KEY, or GitHub Actions secret)
finnhub_key: ""

# Build Settings
markdown: kramdown
highlighter: rouge
future: true
permalink: /blog/:title/

# Exclude from Jekyll processing (demos are standalone static builds)
exclude:
  - asset-comovement-research
  - research-editor
  - _insert_develop.py
  - _develop_insert.html
  - _live_test.txt
  - Gemfile
  - Gemfile.lock
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  # Keep coursework / drafts / personal previews out of sitemap.xml
  # (files stay reachable by direct URL; they just aren't advertised to search engines)
  - scope:
      path: "career-roadmap-preview.html"
    values:
      sitemap: false
  - scope:
      path: "HW1_Solution.html"
    values:
      sitemap: false
  - scope:
      path: "BACBB_Paper_Full.html"
    values:
      sitemap: false
  - scope:
      path: "BACBB_final.html"
    values:
      sitemap: false
  - scope:
      path: "architecture-diagram.html"
    values:
      sitemap: false
  - scope:
      path: "deep-learning"
    values:
      sitemap: false
  - scope:
      path: "H4T3"
    values:
      sitemap: false
  - scope:
      path: "hh"
    values:
      sitemap: false

include:
  - _pages

# Plugins (jekyll-seo-tag removed: head.html hand-rolls all SEO tags and {% seo %} was never used)
plugins:
  - jekyll-feed
  - jekyll-sitemap
